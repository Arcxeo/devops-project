apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

replicas:
  - name: myapp
    count: 1

images:
  - name: myapp
    newTag: "ae4469be4ebbd63d6044592d17f19d9bc9db4c08"

labels:
  - pairs:
      env: dev
    includeSelectors: false
    includeTemplates: true

patches:
  - target:
      kind: ConfigMap
      name: myapp-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: dev
